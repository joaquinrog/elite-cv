name: Build synthetic sample

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            latexmk \
            poppler-utils \
            lmodern \
            texlive-latex-base \
            texlive-latex-recommended
      - name: Install locked CI dependencies
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Check environment
        run: elitecv doctor --root examples/synthetic-profile
      - name: Check the public tree before building
        run: elitecv check-public
      - name: Run tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q
      - name: Build both synthetic variants
        run: |
          elitecv build --root examples/synthetic-profile --target robotics-software --output-dir examples/synthetic-profile/outputs
          elitecv build --root examples/synthetic-profile --target ai-internship --output-dir examples/synthetic-profile/outputs
      - name: Recheck generated public artifacts
        run: elitecv check-public
      - name: Upload synthetic artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: elitecv-synthetic-sample
          path: examples/synthetic-profile/outputs
          if-no-files-found: error
          retention-days: 7
