[build-system]
requires = ["setuptools>=68,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "elitecv"
version = "0.1.0"
description = "A Git-native CV system with inspectable claim provenance"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0.3,<7"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Elite CV contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test = ["pytest>=9.1.1,<10"]

[project.scripts]
elitecv = "elitecv.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["elitecv*"]

[tool.setuptools.package-data]
elitecv = ["template.tex"]
